# Render Blueprint Specification for CoupleWalah E-Commerce Platform
# Docs: https://render.com/docs/blueprint-spec

services:
  # ==============================================================================
  # COUPLEWALAH UNIFIED FULL-STACK SERVICE (Recommended)
  # Deploys both backend Express API and production React client in a single instance.
  # Eliminates CORS issues, saves Render free-tier quota, and operates on 1 single URL.
  # ==============================================================================
  - type: web
    name: couplewalah
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: CLIENT_URL
        value: https://couplewalah.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM
        value: support@couplewalah.com
